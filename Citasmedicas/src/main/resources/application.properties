spring.application.name=Citasmedicas

# Conexion a MySQL de XAMPP
spring.datasource.url=jdbc:mysql://localhost:3306/citas_medicas?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:junior22Ger+}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
# XAMPP trae MariaDB. Si usas MySQL 8 en vez de XAMPP, define DB_DIALECT=org.hibernate.dialect.MySQLDialect
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.MySQLDialect}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.error.include-message=always
server.error.include-binding-errors=always

server.port=8080

# JWT
# En produccion define la variable de entorno JWT_SECRET (minimo 32 caracteres)
jwt.secret=${JWT_SECRET:clave-solo-para-desarrollo-local-cambiala-en-produccion-32+}
jwt.expiration=3600000

# CORS: origenes del frontend permitidos (separados por coma)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}

# RENIEC (consulta de DNI) - API de Decolecta: https://decolecta.com
# Crea una cuenta gratis, copia tu token y ponlo aqui o en la variable de entorno RENIEC_TOKEN
reniec.api.url=${RENIEC_URL:https://api.decolecta.com/v1/reniec/dni}
reniec.api.token=${RENIEC_TOKEN:sk_19904.UJyVMDUGPNbGbG6SbO4gm7YUjw1vRbIC}
