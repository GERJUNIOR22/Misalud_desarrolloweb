# Perfil "test": usa el MISMO MySQL de XAMPP pero otra base de datos (citas_medicas_test),
# para que los tests nunca toquen tus datos reales de citas_medicas.
# Se crea sola al correr los tests y sus tablas se borran al terminar.
spring.datasource.url=jdbc:mysql://localhost:3306/citas_medicas_test?createDatabaseIfNotExist=true
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
