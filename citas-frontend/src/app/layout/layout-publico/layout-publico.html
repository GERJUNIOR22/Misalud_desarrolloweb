<header class="barra">
  <a routerLink="/" class="marca" aria-label="Mi salud, ir al inicio">
    <span class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
        <path d="M12 5v14M5 12h14" />
      </svg>
    </span>
    <span class="nombre">
      <strong>Mi salud</strong>
      <small>Clínica médica</small>
    </span>
  </a>

  @if (auth.estaAutenticado()) {
    <a routerLink="/inicio" class="acceso">Ir al sistema</a>
  } @else {
    <a routerLink="/login" class="acceso">Soy trabajador</a>
  }
</header>

<main class="contenido">
  <router-outlet />
</main>

<app-footer />
